name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Frontend - Install & Build
        working-directory: ./frontend
        run: |
          pnpm install
          pnpm build

      - name: Backend - Install & Test
        working-directory: ./backend
        run: |
          pnpm install
          pnpm test
